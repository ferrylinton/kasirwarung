<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KasirWarung - Sistem POS Toko Kelontong Multi-Tenant</title>
    <meta name="description" content="Aplikasi POS kasir toko kelontong modern dan multi-tenant untuk manajemen inventaris sembako, kasir cepat, laporan penjualan, struk kasir, dan kontrol hak akses." />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="KasirWarung - Sistem POS Toko Kelontong Multi-Tenant" />
    <meta property="og:description" content="Aplikasi POS kasir toko kelontong modern dan multi-tenant untuk manajemen inventaris sembako, kasir cepat, laporan penjualan, struk kasir, dan kontrol hak akses." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('kasirwarung_theme_dark') === 'true';
          var accent = localStorage.getItem('kasirwarung_theme_accent') || 'green';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          document.documentElement.setAttribute('data-theme-accent', accent);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif] transition-colors">
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
